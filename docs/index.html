<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>STL Auto Reply</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8f3;
      --ink: #191919;
      --muted: #657166;
      --panel: #fffdf8;
      --line: #d9dfcf;
      --raspberry: #c51f46;
      --leaf: #178a4a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: linear-gradient(180deg, rgba(197, 31, 70, 0.08), rgba(23, 138, 74, 0.08)), var(--bg);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.6;
    }

    main {
      width: min(860px, calc(100% - 32px));
      margin: 0 auto;
      padding: 48px 0;
    }

    section {
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 34px;
      line-height: 1.1;
    }

    p {
      margin: 0 0 18px;
      color: var(--muted);
    }

    nav {
      display: grid;
      gap: 10px;
      margin-top: 24px;
    }

    a {
      display: block;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--raspberry);
      background: #fff;
      text-decoration: none;
      font-weight: 700;
    }

    a:hover {
      border-color: var(--leaf);
    }
  </style>
</head>
<body>
  <main>
    <section>
      <h1>STL Auto Reply</h1>
      <p>Aplicativo interno da Imagine3D para responder automaticamente a comentários com palavra-chave em publicações próprias.</p>
      <nav aria-label="Documentos legais">
        <a href="privacy.html">Política de Privacidade</a>
        <a href="terms.html">Termos de Serviço</a>
        <a href="data-deletion.html">Exclusão de Dados</a>
      </nav>
    </section>
  </main>
</body>
</html>
